name: 移転企業チェック(東京23区)

on:
  schedule:
    - cron: '1 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: チェックを実行
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          REPORT_ON_ZERO: 'true'
        run: python check_relocations.py

      - name: 既知アイテムの記録を保存
        run: |
          git config user.name "relocation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          if ! git diff --cached --quiet; then
            git commit -m "update seen.json [skip ci]"
            git push
          else
            echo "変更なし"
          fi
