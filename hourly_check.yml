name: 移転企業チェック(東京23区)

on:
  schedule:
    # 毎時1分に実行(GitHub ActionsのcronはUTCだが、UTC→JSTは時差が9時間ちょうどなので
    # 分の値はそのままでよい。実際の発火は数分〜十数分遅れることがある)
        - cron: '1 * * * 1-5'
  workflow_dispatch: {}   # 手動実行ボタン(Actionsタブから "Run workflow" で今すぐテスト可能)

permissions:
  contents: write   # seen.json をコミットし直すために必要

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: チェックを実行
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          # 動作確認期間はtrueのままにして、0件でも報告メールを送る。
          # 本運用に切り替えたら false にする。
          REPORT_ON_ZERO: 'true'
        run: python check_relocations.py

      - name: 既知アイテムの記録を保存
        run: |
          git config user.name "relocation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          if ! git diff --cached --quiet; then
            git commit -m "update seen.json [skip ci]"
            git push
          else
            echo "変更なし"
          fi
